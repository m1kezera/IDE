appId: com.lumina.ide
productName: Lumina IDE
copyright: "Copyright © 2026 m1kezera"

directories:
  output: "release"

files:
  - electron/**/*
  - frontend-ts/dist/**/*
  - "!node_modules/**/*"
asarUnpack:
  - "electron/**/*"

extraResources:
  - from: "backend/dist_final/LuminaEngine"
    to: "LuminaEngine"
    filter:
      - "**/*"
  - from: "backend/knowledge_base.json"
    to: "backend/knowledge_base.json"
  - from: "backend/.env"
    to: "backend/.env"

win:
  icon: "electron/icon.png"
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: requireAdministrator

nsis:
  artifactName: "Lumina-IDE-Setup-${version}.exe"
  uninstallDisplayName: "Lumina IDE v${version}"
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Lumina IDE"
  include: "installer.nsh"
